<body>

<div class="container">

    <h2>ENTER ACCESS CODE</h2>

    <form id="accessForm">
        <input
            type="text"

            placeholder="PASSWORD"

    </form>

</div>

<script>

    event.preventDefault();

    const password = document.getElementById("password").value.trim();
    const message = document.getElementById("message");

    if (password === "148260") {
        message.textContent = "Congratulations for solving the first part of the puzzle, toM bAte knowS ThE Right location.";
    } else {
